name: Release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          OLD=$(git show HEAD~1:.claude-plugin/plugin.json | jq -r .version)
          NEW=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$OLD" = "$NEW" ]; then
            echo "plugin.json touched but version unchanged ($NEW); skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Version bumped: $OLD -> $NEW"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Verify marketplace.json is in sync
        if: steps.version.outputs.changed == 'true'
        run: |
          NEW="${{ steps.version.outputs.version }}"
          MARKET=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$MARKET" != "$NEW" ]; then
            echo "::error::plugin.json says $NEW but marketplace.json says $MARKET — must match per CLAUDE.md."
            exit 1
          fi

      - name: Verify tag does not already exist
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump to a new version or delete the tag manually."
            exit 1
          fi

      - name: Extract changelog section
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / {
              if (in_section) exit
              if ($2 == v) { in_section = 1; next }
            }
            in_section { print }
          ' docs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog section found for version $VERSION in docs/changelog.md. Per CLAUDE.md, every version bump requires a changelog entry."
            exit 1
          fi
          echo "::group::Release notes for v$VERSION"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create tag and release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
