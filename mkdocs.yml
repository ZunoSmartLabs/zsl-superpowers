site_name: ZSL Superpowers
site_url: https://superpowers.zsl.dev
site_description: Agent skills for real engineering, not vibe coding.
site_author: ZunoSmartLabs
repo_url: https://github.com/ZunoSmartLabs/zsl-superpowers
repo_name: ZunoSmartLabs/zsl-superpowers
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - social

hooks:
  - scripts/mkdocs_hooks/skill_pages.py

nav:
  - Home: index.md
  - Why these skills exist: why.md
  - Getting started:
      - Quickstart: quickstart.md
      - Per-repo setup: setup.md
  - Using ZSL:
      - The loop: workflow.md
      - Triage state machine: concepts/state-machine.md
      - Git branching: concepts/branching.md
  - Deep dives:
      - Parallel TDD: tdd-parallel.md
      - Code review: code-review.md
      - Remote agents (overnight): remote-agents.md
  - Skills:
      - Overview: skills/index.md
      - Plan:
          - skills/grill-with-docs.md
          - skills/grill-me.md
          - skills/to-prd.md
      - Break down:
          - skills/to-issues.md
          - skills/triage.md
      - Build:
          - skills/tdd.md
          - skills/tdd-parallel.md
          - skills/human-itl.md
          - skills/diagnose.md
      - Verify:
          - skills/verify-coverage.md
      - Ship:
          - skills/git-branch.md
          - skills/commit.md
          - skills/commit-push-pr.md
          - skills/code-review.md
      - Overnight (remote agents):
          - skills/afk-fanout.md
          - skills/afk-worker.md
          - skills/morning-review.md
      - Cross-cutting:
          - skills/improve-codebase-architecture.md
          - skills/zoom-out.md
      - Off-loop and meta:
          - skills/prototype.md
          - skills/handoff.md
          - skills/timesheet.md
          - skills/caveman.md
          - skills/write-a-skill.md
          - skills/edit-article.md
          - skills/setup-pre-commit.md
          - skills/steampipe.md
          - skills/setup-zsl-superpowers.md
  - Reference:
      - FAQ: faq.md
      - Changelog: changelog.md
      - Privacy: privacy.md
  - Contributing:
      - How to contribute: contributing.md
      - Plugin architecture: architecture.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
